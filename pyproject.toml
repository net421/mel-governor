[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mel-governor"
version = "0.1.0"
description = "Multi-agent political-economy research and evidence-governance laboratory"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Emmanuel Beristain Guzman"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
groq = ["groq==0.30.0"]

[project.scripts]
mel-governor = "mel_governor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mel_governor = ["prompts.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
